name: cashfree_pg
description: The official Flutter plugin for Cashfree PG integration. It opens the payment page inside a webview.
version: 2.0.12+32
homepage: https://www.cashfree.com/


environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=1.12.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.cashfree.cashfree_pg
        pluginClass: CashfreePgPlugin
      ios:
        pluginClass: CashfreePgPlugin
      web:
        pluginClass: CashfreePgWeb
        fileName: cashfree_pg_web.dart

