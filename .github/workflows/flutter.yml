name: Flutter CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter Version
        run: flutter --version

      - name: Flutter Doctor
        run: flutter doctor

      - name: Get Packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release
